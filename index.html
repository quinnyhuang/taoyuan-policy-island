      if(L<.3){busS.wp.shift();if(!busS.wp.length){busS.mode="leave";busS.t=0;const side=busS.head+Math.PI/2;player.position.set(egg.position.x+Math.cos(side)*1.7,0,egg.position.z-Math.sin(side)*1.7);player.visible=shadowDisc.visible=true;burst(player.position.x,1.5,player.position.z);toast(`到站：${busS.dest.name}島`)}}
      else{const sp=Math.min(L,8*dt);egg.position.x+=dx/L*sp;egg.position.z+=dz/L*sp;const hd=Math.atan2(-dz,dx);let d=hd-busS.head;d=Math.atan2(Math.sin(d),Math.cos(d));busS.head+=d*Math.min(1,dt*7);egg.rotation.y=busS.head;egg.position.y=heightAt(egg.position.x,egg.position.z)+Math.abs(Math.sin(t*16))*.025;spinW(10)}}
    else if(busS.mode==="leave"){busS.t+=dt;const sp=6*dt*Math.min(1,busS.t*1.5);egg.position.x+=Math.cos(busS.head)*sp;egg.position.z-=Math.sin(busS.head)*sp;egg.position.y=heightAt(egg.position.x,egg.position.z);spinW(8);egg.scale.setScalar(Math.max(.01,1-Math.max(0,busS.t-1.4)/.6));
      if(busS.t>2){egg.visible=false;egg.scale.setScalar(1);busS.mode="off"}}}
  CONF.forEach(c=>{if(c.life<=0)return;c.life-=dt;c.v.y-=12*dt;c.m.position.addScaledVector(c.v,dt);c.m.rotation.x+=c.spin.x*dt;c.m.rotation.z+=c.spin.z*dt;c.m.scale.setScalar(Math.max(.01,Math.min(1,c.life)));if(c.life<=0)c.m.visible=false});
  if(!RM){waves(t);ANIM.forEach(f=>f(t,dt))}
  clouds.forEach((c,i)=>{c.position.x+=dt*(.6+i*.05);if(c.position.x>110)c.position.x=-110});
  birds.forEach(b=>{const a=t*b.sp+b.ph;b.g.position.set(Math.cos(a)*b.r,b.h+Math.sin(t*1.3+b.ph)*.6,Math.sin(a)*b.r*.7);b.g.rotation.y=-a;const f=Math.sin(t*9+b.ph)*.5;b.wl.rotation.z=f;b.wr.rotation.z=-f});
  /* camera */
  const narrow=innerWidth<640;let fx,fz;
  if(sbMode){camPos.set(sbT.x,sbDist*.78,sbT.z+sbDist*.62);camLook.copy(sbT);fx=sbT.x;fz=sbT.z}
  else{const back=narrow?18:15;camPos.set(px+vel.x*.25,(narrow?30:22),pz+back+vel.z*.25);camLook.set(px+vel.x*.35,1,pz-1+vel.z*.35);fx=px;fz=pz}
  if(first){cam.position.copy(camPos);look.copy(camLook);first=false}
  const ck=1-Math.exp(-dt*(sbMode?6:3)),lk=1-Math.exp(-dt*(sbMode?7:5));cam.position.lerp(camPos,ck);look.lerp(camLook,lk);cam.lookAt(look);
  const sx=sbMode?Math.min(90,Math.max(46,sbDist*.6)):46;Object.assign(sun.shadow.camera,{left:-sx,right:sx,top:sx,bottom:-sx});sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(fx-30,55,fz+28);sun.target.position.set(fx,0,fz);
  renderer.render(scene,cam);
  /* labels */
  const W=innerWidth,H=innerHeight;
  LAB.forEach(o=>{const p=o.anchor.clone().project(cam);const vis=p.z<1&&Math.abs(p.x)<1.05&&Math.abs(p.y)<1.05;const dist=cam.position.distanceTo(o.anchor);
    let hide=!vis;
    if(o.kind==="bubble")hide=hide||!o.show||dist>(sbMode?90:48);
    else if(sbMode)hide=hide||(o.kind==="sub"&&dist>80)||(o.kind==="npc"&&dist>90&&o.el!==bossLab.el);
    else hide=hide||(o.kind==="sub"&&dist>34)||(o.kind==="npc"&&dist>44)||(o.kind==="isl"&&dist>72);
    o.el.classList.toggle("far",hide);o.el.style.left=((p.x+1)/2*W)+"px";o.el.style.top=((1-p.y)/2*H)+"px"});
  requestAnimationFrame(step);
}
addEventListener("resize",()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
step();
})()}
</script>
